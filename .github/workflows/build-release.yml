name: Build Cross-Platform Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Required for softprops/action-gh-release to attach zip assets on tag builds
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Application Python source is cloned from VidVortex_Source into ./app for each job.
          # archive_kind: skip = zip produced inside build_cmd (Windows), else linux/macos archive steps run
          - runner: windows-latest
            artifact_name: VidVortex-windows
            upload_path: app/dist/VidVortex-windows.zip
            build_cmd: powershell -ExecutionPolicy Bypass -File app/scripts/build_windows.ps1
            archive_kind: skip

          - runner: ubuntu-latest
            artifact_name: VidVortex-linux
            executable_path: app/dist/linux/VidVortex
            archive_name: VidVortex-linux.zip
            package_dir: package/linux
            upload_path: VidVortex-linux.zip
            build_cmd: bash app/scripts/build_linux.sh
            archive_kind: linux

          # Apple Silicon (arm64)
          - runner: macos-15
            artifact_name: VidVortex-macos-arm64
            executable_path: app/dist/macos/VidVortex
            archive_name: VidVortex-macos-arm64.zip
            package_dir: package/macos-arm64
            upload_path: VidVortex-macos-arm64.zip
            build_cmd: bash app/scripts/build_macos.sh
            archive_kind: macos

          # Intel (x86_64)
          - runner: macos-15-intel
            artifact_name: VidVortex-macos-intel
            executable_path: app/dist/macos/VidVortex
            archive_name: VidVortex-macos-intel.zip
            package_dir: package/macos-intel
            upload_path: VidVortex-macos-intel.zip
            build_cmd: bash app/scripts/build_macos.sh
            archive_kind: macos

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout distribution repo (packaging only)
        uses: actions/checkout@v4

      # If VidVortex_Source is private, set secret VIDVORTEX_SOURCE_CHECKOUT_TOKEN (read access).
      # If unset, falls back to github.token (works when Source is public).
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: Estebanech1620/VidVortex_Source
          path: app
          token: ${{ secrets.VIDVORTEX_SOURCE_CHECKOUT_TOKEN || github.token }}

      - name: Overlay CI packaging scripts and release helpers
        shell: bash
        run: |
          mkdir -p app/scripts app/release
          cp -R scripts/. app/scripts/
          cp -R release/. app/release/

      - name: Verify application entrypoint
        shell: bash
        run: test -f app/vidvortex_app.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        shell: bash
        run: ${{ matrix.build_cmd }}

      - name: Archive package (Linux)
        if: matrix.archive_kind == 'linux'
        shell: bash
        run: |
          mkdir -p "${{ matrix.package_dir }}"
          cp "${{ matrix.executable_path }}" "${{ matrix.package_dir }}/VidVortex"
          cp "scripts/setup_linux.sh" "${{ matrix.package_dir }}/setup_linux.sh"
          cp "release/RUN_FIRST_LINUX.sh" "${{ matrix.package_dir }}/RUN_FIRST.sh"
          chmod +x "${{ matrix.package_dir }}/VidVortex" "${{ matrix.package_dir }}/setup_linux.sh" "${{ matrix.package_dir }}/RUN_FIRST.sh"
          (cd "${{ matrix.package_dir }}" && zip -r "../../${{ matrix.archive_name }}" .)

      - name: Archive package (macOS)
        if: matrix.archive_kind == 'macos'
        shell: bash
        run: |
          mkdir -p "${{ matrix.package_dir }}"
          cp "${{ matrix.executable_path }}" "${{ matrix.package_dir }}/VidVortex"
          cp "scripts/setup_macos.sh" "${{ matrix.package_dir }}/setup_macos.sh"
          cp "release/RUN_FIRST.command" "${{ matrix.package_dir }}/RUN_FIRST.command"
          chmod +x "${{ matrix.package_dir }}/VidVortex" "${{ matrix.package_dir }}/setup_macos.sh" "${{ matrix.package_dir }}/RUN_FIRST.command"
          (cd "${{ matrix.package_dir }}" && zip -r "../../${{ matrix.archive_name }}" .)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.upload_path }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.upload_path }}
