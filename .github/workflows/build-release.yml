name: Build Cross-Platform Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach zips to (e.g. v1.2.0). Leave empty to build artifacts only — Releases are not updated unless this is set or you push a v* tag."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            build_shell: pwsh
            artifact_name: VidVortex-windows
            upload_path: app/dist/VidVortex-windows.zip
            build_cmd: ./app/scripts/build_windows.ps1
            archive_kind: skip

          - runner: ubuntu-latest
            build_shell: bash
            artifact_name: VidVortex-linux
            executable_path: app/dist/linux/VidVortex
            archive_name: VidVortex-linux.zip
            package_dir: package/linux
            upload_path: VidVortex-linux.zip
            build_cmd: bash app/scripts/build_linux.sh
            archive_kind: linux

          - runner: macos-15
            build_shell: bash
            artifact_name: VidVortex-macos-arm64
            executable_path: app/dist/macos/VidVortex
            archive_name: VidVortex-macos-arm64.zip
            package_dir: package/macos-arm64
            upload_path: VidVortex-macos-arm64.zip
            build_cmd: bash app/scripts/build_macos.sh
            archive_kind: macos

          - runner: macos-15-intel
            build_shell: bash
            artifact_name: VidVortex-macos-intel
            executable_path: app/dist/macos/VidVortex
            archive_name: VidVortex-macos-intel.zip
            package_dir: package/macos-intel
            upload_path: VidVortex-macos-intel.zip
            build_cmd: bash app/scripts/build_macos.sh
            archive_kind: macos

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@v4

      # Application sources live in a separate repository (private). Configure:
      # - BUILD_APP_REPOSITORY (e.g. Estebanech1620/VidVortex_Source)
      # - BUILD_APP_CHECKOUT_TOKEN (PAT with read access to that repo)
      #
      # If BUILD_APP_CHECKOUT_TOKEN is omitted, checkout falls back to GITHUB_TOKEN (works only when the app repo is public).
      - name: Require application repository secret
        shell: bash
        env:
          APP_REPO: ${{ secrets.BUILD_APP_REPOSITORY }}
        run: |
          if [ -z "${APP_REPO}" ]; then
            echo "::error::Missing Actions secret BUILD_APP_REPOSITORY. Set it to owner/name of the repo that contains vidvortex_app.py (for example Estebanech1620/VidVortex_Source)."
            exit 1
          fi

      - name: Checkout application tree
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_APP_REPOSITORY }}
          path: app
          token: ${{ secrets.BUILD_APP_CHECKOUT_TOKEN || github.token }}

      - name: Overlay packaging into application tree
        shell: bash
        run: |
          mkdir -p app/scripts app/release
          cp -R scripts/. app/scripts/
          cp -R release/. app/release/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        shell: ${{ matrix.build_shell }}
        run: ${{ matrix.build_cmd }}

      - name: Archive package (Linux)
        if: matrix.archive_kind == 'linux'
        shell: bash
        run: |
          mkdir -p "${{ matrix.package_dir }}"
          cp "${{ matrix.executable_path }}" "${{ matrix.package_dir }}/VidVortex"
          cp "scripts/setup_linux.sh" "${{ matrix.package_dir }}/setup_linux.sh"
          cp "release/RUN_FIRST_LINUX.sh" "${{ matrix.package_dir }}/RUN_FIRST.sh"
          chmod +x "${{ matrix.package_dir }}/VidVortex" "${{ matrix.package_dir }}/setup_linux.sh" "${{ matrix.package_dir }}/RUN_FIRST.sh"
          (cd "${{ matrix.package_dir }}" && zip -r "../../${{ matrix.archive_name }}" .)

      - name: Archive package (macOS)
        if: matrix.archive_kind == 'macos'
        shell: bash
        run: |
          mkdir -p "${{ matrix.package_dir }}"
          cp "${{ matrix.executable_path }}" "${{ matrix.package_dir }}/VidVortex.bin"
          cp "scripts/setup_macos.sh" "${{ matrix.package_dir }}/setup_macos.sh"
          cp "release/RUN_FIRST.command" "${{ matrix.package_dir }}/RUN_FIRST.command"
          cp "release/VidVortex.command" "${{ matrix.package_dir }}/VidVortex.command"
          chmod +x "${{ matrix.package_dir }}/VidVortex.bin" "${{ matrix.package_dir }}/setup_macos.sh" "${{ matrix.package_dir }}/RUN_FIRST.command" "${{ matrix.package_dir }}/VidVortex.command"
          (cd "${{ matrix.package_dir }}" && zip -r "../../${{ matrix.archive_name }}" .)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.upload_path }}

      - name: Upload release asset
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          files: ${{ matrix.upload_path }}
